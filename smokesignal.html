<!DOCTYPE html>
<html lang="en">
<head>
<title>Smokesignal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="smokesignal.css">
<style>
  #site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(13,17,23,.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem;
    border-bottom: 1px solid #21262d; font-size: .82rem; }
  #site-nav a { color: #58a6ff; text-decoration: none; font-weight: 600; }
  #site-nav a:hover { text-decoration: underline; }
  #site-nav .name { color: #e6edf3; }
  #site-nav .sep { color: #30363d; }
  body { padding-top: 36px; }
</style>
<script src="jsQR.js"></script>
<script src="qrcode.js"></script>
<script src="smokesignal.js"></script>
</head>
<body>
<nav id="site-nav">
  <span class="name">qrvid</span>
  <span class="sep">/</span>
  <a href="index.html">Home</a>
  <span class="sep">/</span>
  <a href="qrvid-encode.html">GIF Encoder</a>
</nav>
<div id="phone-upper" class="qr-container">
  <div class="qr-left vertical-layout hide-on-mobile">
    <div class="vertical sent-text-container">
      <div id="sent-text">(Sent QR text)</div>
    </div>
    <div class="vertical received-text-container">
      <div id="received-text">(Scan results)</div>
    </div>
  </div>
  <div id="qrcode"></div>
  <div class="qr-right vertical-layout hide-on-mobile">
    <div class="vertical upload-container">
      <input type="file" id="file-input"><br>
      <button id="file-upload">Send</button>
    </div>
    <div class="vertical qr-reader-container">
      <div id="qr-reader"></div>
    </div>
  </div>
</div>
<div id="phone-lower" class="horizontal-layout show-on-mobile">
  <!-- when it's a phone, and in profile orientation, the top will only
    show the QR code; the other fields will be moved below it -->
  <div class="horizontal sent-text-container"></div>
  <div class="horizontal received-text-container"></div>
  <div class="horizontal upload-container"></div>
  <div class="horizontal qr-reader-container"></div>
</div>
</body>
</html>
